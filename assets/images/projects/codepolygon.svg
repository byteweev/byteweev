<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#09090b" />
  <rect x="0.5" y="0.5" width="799" height="479" rx="15.5" stroke="#27272a" />

  <!-- Subtle Coordinate Grid -->
  <defs>
    <pattern id="cp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#cp-grid)" opacity="0.8" />

  <!-- Browser Chrome Header -->
  <rect x="20" y="20" width="760" height="44" rx="8" fill="#121215" stroke="#27272a" />
  <circle cx="44" cy="42" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="60" cy="42" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="76" cy="42" r="5" fill="#10b981" opacity="0.8" />
  <rect x="100" y="32" width="280" height="20" rx="4" fill="#18181b" />
  <text x="110" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">https://codepolygon.github.io</text>
  <rect x="660" y="32" width="100" height="20" rx="10" fill="#10b981" fill-opacity="0.15" />
  <text x="672" y="46" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">LIVE HUB</text>

  <!-- Website Hero Preview -->
  <rect x="20" y="74" width="760" height="386" rx="8" fill="#111116" stroke="#27272a" />
  
  <!-- Studio Navbar in Preview -->
  <line x1="20" y1="124" x2="780" y2="124" stroke="#1f1f28" stroke-width="1" />
  <rect x="50" y="94" width="22" height="22" rx="4" fill="#3b82f6" />
  <text x="54" y="110" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="900" fill="#ffffff">CO</text>
  <text x="80" y="110" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#ffffff">CodePolygon</text>
  <text x="480" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a1a1aa">Home</text>
  <text x="540" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a1a1aa">About</text>
  <text x="600" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a1a1aa">Projects</text>
  <text x="670" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a1a1aa">Blog</text>

  <!-- Hero Content inside codepolygon -->
  <g transform="translate(50, 160)">
    <text y="40" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-1">DEVELOPER PORTFOLIO</text>
    <text y="75" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#3b82f6">// AI, AUTOMATION &amp; CREATIVE TOOLS</text>
    
    <text y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#a1a1aa">Showcase of technical experiments, systems automation, interactive graphics, and generative AI integrations.</text>

    <!-- Mini Project Cards in Preview -->
    <g transform="translate(0, 150)">
      <rect width="210" height="90" rx="8" fill="#181822" stroke="#2b2b3b" />
      <text x="16" y="32" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Automation Scripts</text>
      <text x="16" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a1a1aa">Cross-platform workflow tools</text>
      <text x="16" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">Python • Bash • Docker</text>

      <rect x="230" width="210" height="90" rx="8" fill="#181822" stroke="#2b2b3b" />
      <text x="246" y="32" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Generative AI Tools</text>
      <text x="246" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a1a1aa">LLM integration &amp; agents</text>
      <text x="246" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3b82f6">FastAPI • PyTorch • Qdrant</text>

      <rect x="460" width="210" height="90" rx="8" fill="#181822" stroke="#2b2b3b" />
      <text x="476" y="32" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Creative 3D Shaders</text>
      <text x="476" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a1a1aa">Procedural graphics in WebGL</text>
      <text x="476" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#eab308">Three.js • GLSL • Canvas</text>
    </g>
  </g>
</svg>
