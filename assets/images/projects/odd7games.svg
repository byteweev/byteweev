<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#09090b" />
  <rect x="0.5" y="0.5" width="799" height="479" rx="15.5" stroke="#27272a" />

  <!-- Subtle Coordinate Grid -->
  <defs>
    <pattern id="odd7-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#odd7-grid)" opacity="0.8" />

  <!-- Browser Chrome Header -->
  <rect x="20" y="20" width="760" height="44" rx="8" fill="#121215" stroke="#27272a" />
  <circle cx="44" cy="42" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="60" cy="42" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="76" cy="42" r="5" fill="#10b981" opacity="0.8" />
  <rect x="100" y="32" width="280" height="20" rx="4" fill="#18181b" />
  <text x="110" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">https://odd7games.com</text>
  <rect x="660" y="32" width="100" height="20" rx="10" fill="#10b981" fill-opacity="0.15" />
  <text x="674" y="46" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">LIVE STUDIO</text>

  <!-- Website Hero Preview -->
  <rect x="20" y="74" width="760" height="386" rx="8" fill="#0d0d11" stroke="#27272a" />
  
  <!-- Studio Navbar in Preview -->
  <line x1="20" y1="124" x2="780" y2="124" stroke="#1f1f26" stroke-width="1" />
  <text x="50" y="106" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="900" letter-spacing="1.5" fill="#ffffff">ODD7GAMES</text>
  <text x="440" y="105" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#a1a1aa">GAMES</text>
  <text x="520" y="105" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#a1a1aa">ABOUT</text>
  <text x="590" y="105" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#a1a1aa">CONTACT</text>
  <rect x="670" y="90" width="90" height="24" rx="4" fill="#ffffff" />
  <text x="686" y="106" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="800" fill="#000000">PLAY NOW</text>

  <!-- Hero Content inside odd7games.com -->
  <g transform="translate(50, 160)">
    <rect width="180" height="20" rx="10" fill="#ef4444" fill-opacity="0.2" />
    <text x="12" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ef4444">PLAYTEST TO BE ANNOUNCED</text>

    <text y="70" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-1">THIS IS WHERE<br/>IDEAS BURN.</text>
    
    <text y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#a1a1aa">We craft bold, high-contrast, premium gaming experiences. No templates, just pure action.</text>

    <rect y="160" width="220" height="42" rx="8" fill="#ffffff" />
    <text x="24" y="186" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#000000">REGISTER AS BETA TESTER →</text>
  </g>

  <!-- Right: Game Showcase Feature Graphic -->
  <g transform="translate(480, 150)">
    <rect width="270" height="260" rx="12" fill="#14141a" stroke="#2a2a35" stroke-width="1.5" />
    <!-- Angular Geometry Motif -->
    <polygon points="135,30 230,110 200,220 70,220 40,110" fill="#1f1f2b" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2" />
    <circle cx="135" cy="130" r="30" fill="#ef4444" fill-opacity="0.3" />
    <polygon points="135,115 150,140 120,140" fill="#ffffff" />
    <text x="65" y="245" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff">TACTICAL TITLE REVEAL</text>
  </g>
</svg>
