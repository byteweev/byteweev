<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#09090b" />
  <rect x="0.5" y="0.5" width="799" height="479" rx="15.5" stroke="#27272a" />

  <!-- Subtle Coordinate Grid -->
  <defs>
    <pattern id="kinetic-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#kinetic-grid)" opacity="0.8" />

  <!-- Window Header -->
  <rect x="20" y="20" width="760" height="44" rx="8" fill="#121215" stroke="#27272a" />
  <circle cx="44" cy="42" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="60" cy="42" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="76" cy="42" r="5" fill="#10b981" opacity="0.8" />
  <text x="100" y="46" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a1a1aa">KINETIC DRIVER APP // OFFLINE-FIRST FIELD MOBILITY</text>
  <rect x="655" y="32" width="105" height="20" rx="10" fill="#10b981" fill-opacity="0.15" />
  <text x="668" y="46" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">99.98% CRASH-FREE</text>

  <!-- Left: Mobile Device Frame Mockup -->
  <g transform="translate(140, 78)">
    <!-- Device Body -->
    <rect width="210" height="375" rx="28" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="65" y="10" width="80" height="16" rx="8" fill="#09090b" />
    
    <!-- App Screen Area -->
    <rect x="12" y="32" width="186" height="330" rx="16" fill="#09090b" />

    <!-- App Header in Phone -->
    <text x="24" y="58" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#fafafa">Route #44-B</text>
    <rect x="135" y="46" width="50" height="16" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="142" y="58" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#10b981">SYNCED</text>

    <!-- Mini Map Area in Phone -->
    <rect x="22" y="70" width="166" height="100" rx="10" fill="#121215" stroke="#27272a" />
    <!-- Mini road polyline -->
    <path d="M 36 140 L 70 110 L 110 130 L 160 85" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="36" cy="140" r="4" fill="#10b981" />
    <circle cx="160" cy="85" r="5" fill="#fafafa" stroke="#10b981" stroke-width="2" />

    <!-- Active Delivery Card in Phone -->
    <rect x="22" y="180" width="166" height="85" rx="8" fill="#18181b" stroke="#27272a" />
    <text x="32" y="200" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#fafafa">Package #920-84</text>
    <text x="32" y="216" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#a1a1aa">442 Industrial Parkway, Bay 4</text>
    <text x="32" y="234" font-family="'JetBrains Mono', monospace" font-size="9" fill="#eab308">Proof: Signature Required</text>

    <!-- Scan Barcode Button in Phone -->
    <rect x="22" y="278" width="166" height="34" rx="8" fill="#ffffff" />
    <text x="56" y="300" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#000000">SCAN BARCODE</text>

    <!-- Home Indicator -->
    <rect x="65" y="352" width="80" height="4" rx="2" fill="#52525b" />
  </g>

  <!-- Right: Architecture & Telemetry Specs -->
  <g transform="translate(400, 78)">
    <rect width="380" height="110" rx="8" fill="#121215" stroke="#27272a" />
    <text x="24" y="34" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#71717a">OFFLINE-FIRST ARCHITECTURE</text>
    <text x="24" y="68" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#fafafa">Zero Connectivity Loss</text>
    <p></p>
    <text x="24" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a1a1aa">SQLite database embedded locally on device with automated conflict-free delta sync.</text>

    <rect y="125" width="180" height="110" rx="8" fill="#121215" stroke="#27272a" />
    <text x="20" y="155" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#71717a">ACTIVE DRIVERS</text>
    <text x="20" y="195" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#fafafa">1,200+</text>
    <text x="20" y="220" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Concurrent iOS &amp; Android</text>

    <rect x="200" y="125" width="180" height="110" rx="8" fill="#121215" stroke="#27272a" />
    <text x="220" y="155" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#71717a">BARCODE LATENCY</text>
    <text x="220" y="195" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#fafafa">42 ms</text>
    <text x="220" y="220" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">Hardware Camera SDK</text>

    <rect y="250" width="380" height="125" rx="8" fill="#121215" stroke="#27272a" />
    <text x="24" y="280" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#71717a">ENTERPRISE COMPLIANCE</text>
    <text x="24" y="310" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">✓ Hardware Biometric FaceID / Fingerprint</text>
    <text x="24" y="332" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">✓ AES-256 On-Device Vault Storage</text>
    <text x="24" y="354" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">✓ Battery Optimization &lt; 4% per 8h shift</text>
  </g>
</svg>
