<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#09090b" />
  <rect x="0.5" y="0.5" width="799" height="479" rx="15.5" stroke="#27272a" />

  <!-- Subtle Coordinate Grid -->
  <defs>
    <pattern id="mg-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#mg-grid)" opacity="0.8" />

  <!-- Browser Chrome Header -->
  <rect x="20" y="20" width="760" height="44" rx="8" fill="#121215" stroke="#27272a" />
  <circle cx="44" cy="42" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="60" cy="42" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="76" cy="42" r="5" fill="#10b981" opacity="0.8" />
  <rect x="100" y="32" width="280" height="20" rx="4" fill="#18181b" />
  <text x="110" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">https://mithilagames.com</text>
  <rect x="655" y="32" width="105" height="20" rx="10" fill="#10b981" fill-opacity="0.15" />
  <text x="668" y="46" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">GAME STUDIO LAB</text>

  <!-- Website Hero Preview -->
  <rect x="20" y="74" width="760" height="386" rx="8" fill="#08090c" stroke="#232735" />
  
  <!-- Studio Navbar in Preview -->
  <line x1="20" y1="124" x2="780" y2="124" stroke="#151821" stroke-width="1" />
  <text x="50" y="106" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="900" fill="#e5a93c">MITHILA GAMES</text>
  <text x="420" y="105" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#b5b9c5">GAMES</text>
  <text x="490" y="105" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#b5b9c5">TOOLS</text>
  <text x="560" y="105" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#b5b9c5">ABOUT</text>
  <text x="630" y="105" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#b5b9c5">CONTACT</text>

  <!-- Hero Content inside mithilagames.com -->
  <g transform="translate(50, 160)">
    <rect width="160" height="20" rx="10" fill="#e5a93c" fill-opacity="0.2" />
    <text x="12" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#e5a93c">CREATIVE LAB &amp; STUDIO</text>

    <text y="70" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="-1">MECHANICS-FIRST<br/>VIDEO GAMES &amp; TOOLS.</text>
    
    <text y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">Independent game development studio creating original games and open-source development tools.</text>

    <rect y="160" width="180" height="42" rx="8" fill="#e5a93c" />
    <text x="24" y="186" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#08090c">EXPLORE RELEASES →</text>
  </g>

  <!-- Right: Low-Poly Floating Origami Aircraft (Wings of Paper) Preview -->
  <g transform="translate(480, 145)">
    <rect width="270" height="270" rx="12" fill="#0f1117" stroke="#232735" stroke-width="1.5" />
    <!-- Sky backdrop -->
    <rect x="8" y="8" width="254" height="200" rx="8" fill="#0ea5e9" fill-opacity="0.15" />
    <!-- Yellow Low-Poly Plane Silhouette -->
    <polygon points="135,40 210,130 160,120 135,170 110,120 60,130" fill="#eab308" stroke="#ca8a04" stroke-width="2" />
    <!-- Cockpit & Propeller -->
    <circle cx="135" cy="80" r="12" fill="#ef4444" />
    <ellipse cx="135" cy="80" rx="28" ry="4" fill="#ffffff" fill-opacity="0.8" />
    <text x="35" y="240" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#ffffff">WINGS OF PAPER (SHIPPED)</text>
    <text x="50" y="258" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">60 FPS • GODOT 4 ENGINE</text>
  </g>
</svg>
