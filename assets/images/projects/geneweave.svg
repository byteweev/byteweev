    <text x="20" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a1a1aa">Journal of Molecular Therapeutics • Laboratory Internal Index • 2025</text>
    <rect x="20" y="174" width="90" height="18" rx="4" fill="#10b981" fill-opacity="0.15" />
    <text x="28" y="187" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10b981">0.928 COSINE</text>
    <rect x="120" y="174" width="75" height="18" rx="4" fill="#27272a" />
    <text x="128" y="187" font-family="'JetBrains Mono', monospace" font-size="9" fill="#d4d4d8">1,536 DIMS</text>

    <!-- Result Card 3 -->
