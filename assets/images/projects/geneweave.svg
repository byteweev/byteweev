    <text x="20" y="246" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#fafafa">Optimizing Guide RNA Binding Kinetics via Private LLM</text>
    <text x="20" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a1a1aa">GeneWeave Computational Biology Division • Internal Preprint</text>
    <rect x="20" y="282" width="90" height="18" rx="4" fill="#10b981" fill-opacity="0.15" />
    <text x="28" y="295" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10b981">0.891 COSINE</text>
