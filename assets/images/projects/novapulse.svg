<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#09090b" />
  <rect x="0.5" y="0.5" width="799" height="479" rx="15.5" stroke="#27272a" />

  <!-- Subtle Coordinate Grid -->
  <defs>
    <pattern id="nova-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#nova-grid)" opacity="0.8" />

  <!-- Window Header -->
  <rect x="20" y="20" width="760" height="44" rx="8" fill="#121215" stroke="#27272a" />
  <circle cx="44" cy="42" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="60" cy="42" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="76" cy="42" r="5" fill="#10b981" opacity="0.8" />
  <text x="100" y="46" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a1a1aa">NOVAPULSE PORTAL // ENTERPRISE TELEMETRY DASHBOARD</text>
  <rect x="670" y="32" width="90" height="20" rx="10" fill="#10b981" fill-opacity="0.15" />
  <text x="684" y="46" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">&lt; 400MS SQL</text>

  <!-- Metric Cards Row -->
  <rect x="20" y="74" width="240" height="100" rx="8" fill="#121215" stroke="#27272a" />
  <text x="36" y="98" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#71717a">MONTHLY ACTIVE SEATS</text>
  <text x="36" y="136" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#fafafa">64,280</text>
  <text x="36" y="158" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">▲ +24.8% vs last month</text>

  <rect x="280" y="74" width="240" height="100" rx="8" fill="#121215" stroke="#27272a" />
  <text x="296" y="98" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#71717a">QUERY ENGINE PIPELINE</text>
  <text x="296" y="136" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#fafafa">394 ms</text>
  <text x="296" y="158" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">● ClickHouse Columnar</text>

  <rect x="540" y="74" width="240" height="100" rx="8" fill="#121215" stroke="#27272a" />
  <text x="556" y="98" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#71717a">AGGREGATED DATA POINTS</text>
  <text x="556" y="136" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#fafafa">892.4 M</text>
  <text x="556" y="158" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a1a1aa">Indexed Real-Time</text>

  <!-- Large Area Chart Container -->
  <rect x="20" y="186" width="760" height="274" rx="8" fill="#121215" stroke="#27272a" />
  <text x="40" y="214" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#a1a1aa">THROUGHPUT VOLUME &amp; CONCURRENCY TELEMETRY (PAST 30 DAYS)</text>

  <!-- Horizontal Grid Guides -->
  <line x1="40" y1="240" x2="760" y2="240" stroke="#18181b" stroke-width="1" />
  <line x1="40" y1="290" x2="760" y2="290" stroke="#18181b" stroke-width="1" />
  <line x1="40" y1="340" x2="760" y2="340" stroke="#18181b" stroke-width="1" />
  <line x1="40" y1="390" x2="760" y2="390" stroke="#27272a" stroke-width="1" />

  <!-- Smooth Area Chart Gradient -->
  <defs>
    <linearGradient id="nova-chart-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Filled Area Under Chart -->
  <path d="M 60 380 L 120 340 L 180 350 L 240 280 L 300 300 L 360 250 L 420 270 L 480 230 L 540 240 L 600 200 L 660 210 L 720 180 L 720 390 L 60 390 Z" fill="url(#nova-chart-grad)" />
  
  <!-- Chart Line Curve -->
  <path d="M 60 380 L 120 340 L 180 350 L 240 280 L 300 300 L 360 250 L 420 270 L 480 230 L 540 240 L 600 200 L 660 210 L 720 180" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- High point beacon -->
  <circle cx="720" cy="180" r="10" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="720" cy="180" r="4" fill="#ffffff" />
  <text x="680" y="165" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ffffff">PEAK 2.4k QPS</text>

  <!-- Bottom Timeline Labels -->
  <text x="60" y="420" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">DAY 01</text>
  <text x="220" y="420" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">DAY 08</text>
  <text x="380" y="420" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">DAY 15</text>
  <text x="540" y="420" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">DAY 22</text>
  <text x="700" y="420" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">DAY 30</text>
</svg>
