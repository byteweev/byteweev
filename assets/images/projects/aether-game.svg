<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#09090b" />
  <rect x="0.5" y="0.5" width="799" height="479" rx="15.5" stroke="#27272a" />

  <!-- 3D Perspective Grid in Game Viewport -->
  <defs>
    <linearGradient id="game-sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="70%" stop-color="#121218" />
      <stop offset="100%" stop-color="#1e1e24" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Viewport Area -->
  <rect x="20" y="20" width="760" height="440" rx="10" fill="url(#game-sky-grad)" stroke="#27272a" />

  <!-- 3D Ground Perspective Lines -->
  <line x1="400" y1="240" x2="0" y2="460" stroke="#27272a" stroke-width="1.5" />
  <line x1="400" y1="240" x2="160" y2="460" stroke="#27272a" stroke-width="1.5" />
  <line x1="400" y1="240" x2="320" y2="460" stroke="#27272a" stroke-width="1.5" />
  <line x1="400" y1="240" x2="480" y2="460" stroke="#27272a" stroke-width="1.5" />
  <line x1="400" y1="240" x2="640" y2="460" stroke="#27272a" stroke-width="1.5" />
  <line x1="400" y1="240" x2="800" y2="460" stroke="#27272a" stroke-width="1.5" />

  <!-- Horizontal Ground Perspective Lines -->
  <line x1="280" y1="280" x2="520" y2="280" stroke="#27272a" stroke-width="1" />
  <line x1="200" y1="330" x2="600" y2="330" stroke="#27272a" stroke-width="1" />
  <line x1="100" y1="390" x2="700" y2="390" stroke="#27272a" stroke-width="1" />

  <!-- Geometric Horizon Monoliths / Level Geometry -->
  <polygon points="340,240 370,180 390,240" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
  <polygon points="410,240 430,160 460,240" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
  <polygon points="260,240 290,200 320,240" fill="#121215" stroke="#27272a" stroke-width="1" />
  <polygon points="480,240 510,190 540,240" fill="#121215" stroke="#27272a" stroke-width="1" />

  <!-- Top Engine Header & Debug Telemetry -->
  <rect x="40" y="38" width="720" height="34" rx="6" fill="#09090b" fill-opacity="0.85" stroke="#27272a" />
  <text x="56" y="60" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fafafa">AETHER VOID: PROTOCOL // UNITY 2026 WEBGL CORE</text>
  <text x="520" y="60" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">60.0 FPS [SOLID]</text>
  <text x="650" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">DRAW: 142</text>

  <!-- Tactical Crosshair & Target Reticle in Center -->
  <circle cx="400" cy="240" r="32" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="6 4" fill="none" />
  <circle cx="400" cy="240" r="16" stroke="#10b981" stroke-width="1.5" fill="none" />
  <circle cx="400" cy="240" r="2.5" fill="#10b981" />
  
  <!-- Crosshair Reticle Prongs -->
  <line x1="360" y1="240" x2="380" y2="240" stroke="#10b981" stroke-width="2" />
  <line x1="420" y1="240" x2="440" y2="240" stroke="#10b981" stroke-width="2" />
  <line x1="400" y1="200" x2="400" y2="220" stroke="#10b981" stroke-width="2" />
  <line x1="400" y1="260" x2="400" y2="280" stroke="#10b981" stroke-width="2" />

  <!-- Target Distance & Lock Indicator -->
  <text x="445" y="235" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">LOCK: 148m</text>
  <text x="445" y="250" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">VECTOR: [0.12, -0.84]</text>

  <!-- Top-Right Minimap Radar HUD -->
  <g transform="translate(620, 90)">
    <circle cx="60" cy="60" r="54" fill="#09090b" fill-opacity="0.9" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="60" cy="60" r="36" stroke="#27272a" stroke-width="1" fill="none" />
    <circle cx="60" cy="60" r="18" stroke="#27272a" stroke-width="1" fill="none" />
    <!-- Radar Sweep Line -->
    <line x1="60" y1="60" x2="98" y2="22" stroke="#10b981" stroke-width="1.5" opacity="0.8" />
    <!-- Player Center Pin -->
    <polygon points="60,54 65,66 60,63 55,66" fill="#ffffff" />
    <!-- Enemy Radar Blips -->
    <circle cx="82" cy="45" r="3" fill="#ef4444" />
    <circle cx="40" cy="80" r="3" fill="#ef4444" />
    <circle cx="75" cy="85" r="3" fill="#10b981" />
    <text x="24" y="130" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#a1a1aa">RADAR // ACTIVE</text>
  </g>

  <!-- Bottom-Left Health & Kinetic Shield HUD -->
  <g transform="translate(40, 370)">
    <rect width="240" height="70" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#27272a" />
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#71717a">KINETIC SHIELD</text>
    <text x="180" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">100%</text>
    
    <!-- Shield Bar -->
    <rect x="16" y="30" width="208" height="8" rx="4" fill="#18181b" />
    <rect x="16" y="30" width="208" height="8" rx="4" fill="url(#shield-grad)" />

    <!-- Health Bar -->
    <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#71717a">HULL INTEGRITY</text>
    <text x="190" y="52" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fafafa">94%</text>
    <rect x="16" y="56" width="208" height="6" rx="3" fill="#18181b" />
    <rect x="16" y="56" width="195" height="6" rx="3" fill="#ffffff" />
  </g>

  <!-- Bottom-Right Weapon Arsenal & Ammo HUD -->
  <g transform="translate(520, 370)">
    <rect width="240" height="70" rx="8" fill="#09090b" fill-opacity="0.9" stroke="#27272a" />
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#71717a">PLASMA CARBINE MK-IV</text>
    <text x="16" y="56" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#fafafa">42</text>
    <text x="64" y="56" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" fill="#71717a">/ 240</text>
    <rect x="140" y="36" width="84" height="22" rx="4" fill="#10b981" fill-opacity="0.15" />
    <text x="150" y="51" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#10b981">SEMIAUTO</text>
  </g>
</svg>
