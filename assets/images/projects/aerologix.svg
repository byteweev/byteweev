<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#09090b" />
  <rect x="0.5" y="0.5" width="799" height="479" rx="15.5" stroke="#27272a" />

  <!-- Subtle Coordinate Grid -->
  <defs>
    <pattern id="aero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#aero-grid)" opacity="0.8" />

  <!-- Window Header -->
  <rect x="20" y="20" width="760" height="44" rx="8" fill="#121215" stroke="#27272a" />
  <circle cx="44" cy="42" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="60" cy="42" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="76" cy="42" r="5" fill="#10b981" opacity="0.8" />
  <text x="100" y="46" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a1a1aa">AEROLOGIX DISPATCH // REAL-TIME FLEET TELEMETRY</text>
  <rect x="670" y="32" width="90" height="20" rx="10" fill="#10b981" fill-opacity="0.15" />
  <text x="684" y="46" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">LIVE 3.4M/D</text>

  <!-- Left Sidebar: Active Drivers -->
  <rect x="20" y="74" width="220" height="386" rx="8" fill="#121215" stroke="#27272a" />
  <text x="36" y="102" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#71717a">ACTIVE FLEET (1,420)</text>

  <!-- Driver Card 1 -->
  <rect x="32" y="118" width="196" height="68" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
  <circle cx="48" cy="142" r="4" fill="#10b981" />
  <text x="60" y="146" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fafafa">Unit #804 — LongHaul</text>
  <text x="48" y="168" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a1a1aa">Speed: 64mph • ETA: 14m</text>

  <!-- Driver Card 2 -->
  <rect x="32" y="196" width="196" height="68" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
  <circle cx="48" cy="220" r="4" fill="#10b981" />
  <text x="60" y="224" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fafafa">Unit #312 — Metro Express</text>
  <text x="48" y="246" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a1a1aa">Speed: 38mph • En Route</text>

  <!-- Driver Card 3 -->
  <rect x="32" y="274" width="196" height="68" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
  <circle cx="48" cy="298" r="4" fill="#eab308" />
  <text x="60" y="302" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fafafa">Unit #109 — Loading Bay</text>
  <text x="48" y="324" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a1a1aa">Idle: 04m • Geofence A</text>

  <!-- Driver Card 4 -->
  <rect x="32" y="352" width="196" height="68" rx="6" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
  <circle cx="48" cy="376" r="4" fill="#10b981" />
  <text x="60" y="380" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fafafa">Unit #554 — Regional North</text>
  <text x="48" y="402" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a1a1aa">Speed: 58mph • On Time</text>

  <!-- Center Map & Dispatch Canvas -->
  <rect x="250" y="74" width="530" height="280" rx="8" fill="#121215" stroke="#27272a" />
  
  <!-- Map Route Polylines -->
  <path d="M 290 300 Q 360 220 440 240 T 560 160 T 690 140" fill="none" stroke="#27272a" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 310 180 Q 400 130 500 200 T 640 220 T 730 290" fill="none" stroke="#3f3f46" stroke-width="2" />
  <path d="M 360 310 L 450 250 L 580 230 L 670 150" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />

  <!-- Map Beacon Nodes -->
  <circle cx="360" cy="310" r="14" fill="#10b981" fill-opacity="0.2" />
  <circle cx="360" cy="310" r="6" fill="#10b981" />
  <text x="340" y="338" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">HUB-01</text>

  <circle cx="450" cy="250" r="12" fill="#fafafa" fill-opacity="0.15" />
  <circle cx="450" cy="250" r="5" fill="#fafafa" />
  <text x="435" y="276" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa">WAYPOINT</text>

  <circle cx="580" cy="230" r="16" fill="#10b981" fill-opacity="0.2" />
  <circle cx="580" cy="230" r="7" fill="#10b981" />
  <text x="560" y="210" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">UNIT-804</text>

  <circle cx="670" cy="150" r="18" fill="#eab308" fill-opacity="0.2" />
  <circle cx="670" cy="150" r="7" fill="#eab308" />
  <text x="645" y="130" font-family="'JetBrains Mono', monospace" font-size="9" fill="#eab308">DESTINATION</text>

  <!-- Bottom Analytics Row -->
  <rect x="250" y="364" width="258" height="96" rx="8" fill="#121215" stroke="#27272a" />
  <text x="270" y="392" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#71717a">NETWORK DISPATCH SPEED</text>
  <text x="270" y="426" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#fafafa">14.2 ms</text>
  <text x="390" y="426" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">▲ 99.98% SLA</text>

  <rect x="522" y="364" width="258" height="96" rx="8" fill="#121215" stroke="#27272a" />
  <text x="542" y="392" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#71717a">TOTAL TRANSIT EVENTS</text>
  <text x="542" y="426" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#fafafa">3,412,890</text>
  <text x="696" y="426" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">EVENTS / 24H</text>
</svg>
