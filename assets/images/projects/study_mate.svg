<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#09090b" />
  <rect x="0.5" y="0.5" width="799" height="479" rx="15.5" stroke="#27272a" />

  <!-- Subtle Coordinate Grid -->
  <defs>
    <pattern id="study-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#study-grid)" opacity="0.8" />

  <!-- Browser Chrome Header -->
  <rect x="20" y="20" width="760" height="44" rx="8" fill="#121215" stroke="#27272a" />
  <circle cx="44" cy="42" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="60" cy="42" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="76" cy="42" r="5" fill="#10b981" opacity="0.8" />
  <rect x="100" y="32" width="310" height="20" rx="4" fill="#18181b" />
  <text x="110" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">https://divyanshuarch.github.io/Study_mate</text>
  <rect x="660" y="32" width="100" height="20" rx="10" fill="#10b981" fill-opacity="0.15" />
  <text x="674" y="46" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">LIVE APP</text>

  <!-- Application Dashboard Layout -->
  <rect x="20" y="74" width="760" height="386" rx="8" fill="#0f111a" stroke="#232738" />

  <!-- App Sidebar -->
  <rect x="20" y="74" width="180" height="386" rx="8" fill="#141724" stroke="#232738" />
  <text x="40" y="112" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#ffffff">VertoxStudy</text>
  
  <rect x="32" y="136" width="156" height="34" rx="6" fill="#3b82f6" fill-opacity="0.2" />
  <text x="48" y="158" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#60a5fa">Dashboard</text>

  <text x="48" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Study Timer</text>
  <rect x="130" y="184" width="45" height="18" rx="4" fill="#3b82f6" />
  <text x="136" y="197" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ffffff">25:00</text>

  <text x="48" y="234" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Routine Planner</text>
  <text x="48" y="272" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Project Manager</text>
  <text x="48" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Progress Tracker</text>

  <!-- Main Dashboard Content -->
  <g transform="translate(220, 96)">
    <text y="24" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#ffffff">Welcome Back, Scholar</text>
    <text y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">Your study streak is active. 3 focus blocks remaining today.</text>

    <!-- 3 Widget Cards -->
    <g transform="translate(0, 65)">
      <rect width="165" height="90" rx="8" fill="#171b2b" stroke="#232738" />
      <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">TODAY'S FOCUS</text>
      <text x="16" y="58" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#60a5fa">4.5 hrs</text>
      <text x="16" y="76" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">▲ +45m vs target</text>

      <rect x="180" width="165" height="90" rx="8" fill="#171b2b" stroke="#232738" />
      <text x="196" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">POMODORO ROUNDS</text>
      <text x="196" y="58" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#34d399">8 / 10</text>
      <text x="196" y="76" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">80% Completed</text>

      <rect x="360" width="170" height="90" rx="8" fill="#171b2b" stroke="#232738" />
      <text x="376" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">ACTIVE TASKS</text>
      <text x="376" y="58" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#facc15">5 Tasks</text>
      <text x="376" y="76" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">2 High Priority</text>
    </g>

    <!-- Bottom Study Schedule Timeline -->
    <g transform="translate(0, 175)">
      <rect width="530" height="160" rx="8" fill="#171b2b" stroke="#232738" />
      <text x="20" y="30" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#ffffff">DAILY ROUTINE &amp; SOCRATIC PROBLEM SOLVER</text>
      
      <!-- Timeline entries -->
      <circle cx="30" cy="65" r="4" fill="#3b82f6" />
      <text x="45" y="69" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#ffffff">09:00 AM - 11:30 AM: Advanced Data Structures &amp; Algorithms</text>
      <text x="450" y="69" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">DONE ✓</text>

      <circle cx="30" cy="100" r="4" fill="#facc15" />
      <text x="45" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#ffffff">01:00 PM - 03:00 PM: Computer Architecture &amp; Logic Design</text>
      <text x="440" y="104" font-family="'JetBrains Mono', monospace" font-size="10" fill="#facc15">IN PROGRESS</text>

      <circle cx="30" cy="135" r="4" fill="#94a3b8" />
      <text x="45" y="139" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">04:30 PM - 06:00 PM: Linear Algebra &amp; Vector Spaces</text>
      <text x="450" y="139" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">UPCOMING</text>
    </g>
  </g>
</svg>
