<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0c0c0f"/>
  <!-- Subtle Grid -->
  <defs>
    <pattern id="grid_school_demo_portal.svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c1c22" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid_school_demo_portal.svg)"/>
  
  <!-- Browser Window Frame -->
  <rect x="30" y="30" width="740" height="440" rx="12" fill="#111116" stroke="#222227" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="30" y="30" width="740" height="44" rx="12" fill="#16161c"/>
  <rect x="30" y="62" width="740" height="12" fill="#16161c"/>
  <line x1="30" y1="74" x2="770" y2="74" stroke="#222227" stroke-width="1"/>
  
  <circle cx="54" cy="52" r="5" fill="#ef4444"/>
  <circle cx="72" cy="52" r="5" fill="#f59e0b"/>
  <circle cx="90" cy="52" r="5" fill="#10b981"/>
  
  <rect x="116" y="41" width="440" height="22" rx="6" fill="#0a0a0d" stroke="#26262e" stroke-width="1"/>
  <text x="130" y="56" font-family="monospace" font-size="11" fill="#71717a">https://divyanshuarch.github.io/school-demo</text>
  
  <!-- Content Body -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#3b82f620" stroke="#3b82f650" stroke-width="1"/>
    <text x="90" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#3b82f6" text-anchor="middle">PORTAL // 5 VARIANTS</text>
    
    <text x="0" y="80" font-family="sans-serif" font-size="32" font-weight="900" fill="#ffffff">School Website Concepts</text>
    <text x="0" y="116" font-family="sans-serif" font-size="15" fill="#a1a1aa">Executive Client Comparison Portal</text>
    
    <!-- Wireframe Preview Box -->
    <rect x="0" y="150" width="680" height="170" rx="8" fill="#08080a" stroke="#222227" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="340" y="230" font-family="monospace" font-size="13" fill="#52525b" text-anchor="middle">[ DROP YOUR SCREENSHOT HERE: school_demo_portal.svg ]</text>
    <text x="340" y="255" font-family="sans-serif" font-size="12" fill="#71717a" text-anchor="middle">Comparison & Architecture</text>
  </g>
</svg>