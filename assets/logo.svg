<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <!-- Tilted square group centered at 200, 200 rotated -35 degrees -->
  <g transform="translate(200, 200) rotate(-35) translate(-100, -100)">
    <mask id="byteweev-mask">
      <!-- Base solid white square -->
      <rect x="0" y="0" width="200" height="200" rx="4" fill="#ffffff" />
      <!-- Circular bite cutout on the bottom edge -->
      <circle cx="20" cy="200" r="50" fill="#000000" />
      <circle cx="2" cy="150" r="32" fill="#000000" />
      <!-- Two byte dot cutouts inside the square -->
      <circle cx="120" cy="140" r="18" fill="#000000" />
      <circle cx="170" cy="140" r="18" fill="#000000" />
    </mask>
    <!-- Render the masked shape with currentColor for dynamic theme styling -->
    <rect x="0" y="0" width="200" height="200" rx="4" fill="currentColor" mask="url(#byteweev-mask)" />
  </g>
</svg>
